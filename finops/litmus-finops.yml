specification: FinOps Framework
specificationVersion: '1.0'
schema: https://www.finops.org/framework/
provider: Litmus
providerId: litmus
created: '2026-05-04'
modified: '2026-05-05'
reconciled: true
tags:
  - FinOps
  - FOCUS
  - Email Testing
  - Marketing Tools
  - Developer Tools
description: 'FOCUS-aligned FinOps for Litmus: enterprise SaaS with one base subscription plus opt-in
  add-on subscriptions (Deliverability, Sender Certification, Competitive Intel, Email Guardian, Mailcharts).
  Litmus Instant API access is partner-program-gated. Pricing is custom; charges land as monthly or annual
  subscription invoices rather than per-call usage.'
sources:
  - https://www.litmus.com/pricing
  - https://docs.litmus.com/instant
alignedWith:
  framework: FinOps Foundation Framework
  frameworkUrl: https://www.finops.org/framework/
  dataSpec: FOCUS
  dataSpecVersion: '1.3'
  dataSpecUrl: https://focus.finops.org/focus-specification/v1-3/
publisherName: Litmus Software, Inc.
serviceCategory: Email Testing / Marketing Tools
billingModel:
  pricingCategory: Subscription + Add-Ons
  billingFrequency: Annual
  billingCurrency: USD
  chargeCategories:
    - Purchase
    - Adjustment
    - Credit
focusColumns:
  ServiceName: Litmus
  ServiceCategory: Email Testing / Marketing Tools
  ProviderName: Litmus
  PublisherName: Litmus Software, Inc.
  InvoiceIssuerName: Litmus Software, Inc.
  BillingCurrency: USD
meters:
  - name: enterprise_subscription
    unit: contract
    aggregation: count
    dimensions:
      - contract
  - name: addon_subscriptions
    unit: contract
    aggregation: count
    dimensions:
      - addon
      - contract
  - name: email_previews
    unit: preview
    aggregation: sum
    dimensions:
      - subaccount
      - email_client
  - name: instant_api_calls
    unit: request
    aggregation: sum
    dimensions:
      - endpoint
      - partner_app
  - name: full_users
    unit: seat
    aggregation: count
    dimensions:
      - subaccount
principles:
  - name: Visibility
    description: Track preview / API usage in the Litmus admin and via partner reporting; cross-reference
      against Litmus invoices for the Enterprise subscription and each active add-on.
  - name: Allocation
    description: Use Litmus subaccounts to scope usage to brands, business units, or campaigns; allocate
      the Enterprise subscription cost by subaccount activity.
  - name: Optimization
    description: Cull unused full-user seats; review add-on ROI annually (Deliverability vs Sender Certification
      vs Email Guardian); for partner integrations, batch preview captures and reuse email_guids within
      the 48-hour upload window.
  - name: Accountability
    description: Assign a Litmus contract owner who reviews subaccount usage and add-on consumption ahead
      of each renewal; partners running Instant API integrations report usage back to that owner.
maintainers:
  - FN: Kin Lane
    email: kin@apievangelist.com
