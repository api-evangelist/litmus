naftiko: 1.0.0-alpha2
info:
  label: Litmus Instant API — Clients
  description: 'Litmus Instant API — Clients. 1 operations. Lead operation: Litmus List available email clients. Self-contained
    Naftiko capability covering one Litmus business surface.'
  tags:
  - Litmus
  - Clients
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    LITMUS_API_KEY: LITMUS_API_KEY
capability:
  consumes:
  - type: http
    namespace: instant-clients
    baseUri: https://instant-api.litmus.com/v1
    description: Litmus Instant API — Clients business capability. Self-contained, no shared references.
    resources:
    - name: clients
      path: /clients
      operations:
      - name: listemailclients
        method: GET
        description: Litmus List available email clients
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
    authentication:
      type: bearer
      token: '{{env.LITMUS_API_KEY}}'
  exposes:
  - type: rest
    namespace: instant-clients-rest
    port: 8080
    description: REST adapter for Litmus Instant API — Clients. One Spectral-compliant resource per consumed operation, prefixed
      with /v1.
    resources:
    - path: /v1/clients
      name: clients
      description: REST surface for clients.
      operations:
      - method: GET
        name: listemailclients
        description: Litmus List available email clients
        call: instant-clients.listemailclients
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: instant-clients-mcp
    port: 9090
    transport: http
    description: MCP adapter for Litmus Instant API — Clients. One tool per consumed operation, routed inline through this
      capability's consumes block.
    tools:
    - name: litmus-list-available-email-clients
      description: Litmus List available email clients
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: instant-clients.listemailclients
      outputParameters:
      - type: object
        mapping: $.
