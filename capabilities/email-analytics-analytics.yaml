        idempotent: true
      call: email-analytics-analytics.getcampaignreadtimes
      outputParameters:
      - type: object
        mapping: $.
    - name: litmus-get-campaign-engagement-summary
      description: Litmus Get campaign engagement summary
      hints:
        readOnly: true
        destructive: false
        idempotent: true
      call: email-analytics-analytics.getcampaignsummary
      outputParameters:
      - type: object
        mapping: $.
