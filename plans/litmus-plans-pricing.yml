description: Litmus consolidates pricing under a single Litmus Enterprise plan with unlimited seats and
  unlimited usage; specific pricing is not public and is provided by Litmus sales. Functionality is extended
  via five paid add-ons (Deliverability, Sender Certification, Competitive Intel, Email Guardian, Mailcharts).
  API access (Litmus Instant API) is partner-program-gated and evaluated case-by-case.
sources:
  - https://www.litmus.com/pricing
  - https://docs.litmus.com/instant
plans:
  - id: litmus-enterprise
    name: Litmus Enterprise
    type: enterprise
    description: Litmus's primary commercial plan. Includes unlimited seats and unlimited usage of email
      previews on 100+ clients/devices, personalization impressions, and full users / subaccounts. Pricing
      is custom — contact sales.
    entries:
      - label: Enterprise subscription
        name: enterprise_base
        type: subscription
        metric: contract
        limit: -1
        timeFrame: year
        geo: global
        unit: 1
        price: contact sales
        userMultiplied: false
      - label: Email previews
        name: email_previews
        type: metered
        metric: preview
        limit: -1
        timeFrame: usage
        geo: global
        unit: 1
        price: included
        userMultiplied: false
      - label: Full users
        name: full_users
        type: subscription
        metric: seat
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: true
      - label: Subaccounts
        name: subaccounts
        type: subscription
        metric: subaccount
        limit: -1
        timeFrame: month
        geo: global
        unit: 1
        price: included
        userMultiplied: false
    elements:
      - name: Unlimited seats and usage
      - name: Email previews on 100+ clients & devices
      - name: Unlimited personalization impressions
      - name: Visual / code email builders
      - name: Automated QA checks
      - name: Personalization templates
      - name: Enterprise integrations
  - id: litmus-deliverability
    name: Deliverability Upgrade
    type: subscription
